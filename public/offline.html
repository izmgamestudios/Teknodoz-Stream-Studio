<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#12141a" />
    <title>Bağlantı yok</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
        background: #12141a; color: #e8eaf0;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 28rem; text-align: center; }
      .mark { font-size: 3rem; }
      h1 { margin: 0.5rem 0 0.25rem; font-size: 1.5rem; }
      p { margin: 0.25rem 0; color: #9aa3b2; }
      button {
        margin-top: 1.25rem; padding: 0.6rem 1.2rem; border: 0; border-radius: 0.5rem;
        background: #4fd0d6; color: #12141a; font: inherit; font-weight: 700; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">📡</div>
      <h1>Bağlantı yok · You are offline</h1>
      <p>
        Stüdyo, oda ve canlı yayın internet gerektirir. Bağlantı gelince yeniden dene.
      </p>
      <p>The studio, rooms and live streaming need a connection. Try again when you are back online.</p>
      <button type="button" onclick="location.reload()">Yeniden dene · Retry</button>
    </main>
  </body>
</html>
